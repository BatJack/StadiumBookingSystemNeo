{% extends 'booking/base.html' %}

{% block title %}管理后台 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .dashboard-container {
        max-width: 1000px;
        margin: 16px auto;
        padding: 0 16px;
    }

    .dashboard-card {
        background: white;
        border-radius: var(--radius);
        padding: 24px 24px;
        box-shadow: var(--shadow-sm);
        border: 1px solid #e5e7eb;
        position: relative;
        overflow: hidden;
    }

    .dashboard-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #3498db;
    }

    .dashboard-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .dashboard-header h1 {
        font-size: 26px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 4px;
        letter-spacing: -0.5px;
    }

    .dashboard-header p {
        color: #7f8c8d;
        font-size: 14px;
        margin: 0;
    }

    .management-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
    }

    .management-card {
        background: #f8fafc;
        border-radius: var(--radius);
        padding: 16px 18px;
        border: 1px solid #cbd5e1;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        text-decoration: none;
    }

    .management-card:hover {
        border-color: #3498db;
        background: white;
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .management-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .management-card-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }

    .management-card-icon.blue {
        background: #3498db;
        color: white;
    }

    .management-card-icon.orange {
        background: #f39c12;
        color: white;
    }

    .management-card-icon.green {
        background: #2ecc71;
        color: white;
    }

    .management-card-icon.purple {
        background: #9b59b6;
        color: white;
    }

    .management-card-title {
        font-size: 15px;
        font-weight: 700;
        color: #2c3e50;
        margin: 0;
        letter-spacing: -0.01em;
        white-space: nowrap;
    }

    .management-card-desc {
        color: #7f8c8d;
        font-size: 13px;
        line-height: 1.4;
        flex-grow: 1;
        font-weight: 400;
        margin: 0;
    }

    .management-card-arrow {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        color: #7f8c8d;
        transition: all 0.2s ease;
    }

    .management-card:hover .management-card-arrow {
        color: #3498db;
    }

    .sports-decoration {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
    }

    .sports-decoration::before,
    .sports-decoration::after {
        content: '';
        position: absolute;
        opacity: 0.08;
    }

    .sports-decoration::before {
        width: 300px;
        height: 300px;
        background: #3498db;
        top: -150px;
        right: -100px;
    }

    .sports-decoration::after {
        width: 200px;
        height: 200px;
        background: #2ecc71;
        bottom: -100px;
        left: -50px;
    }

    @media (max-width: 768px) {
        .dashboard-container {
            margin: 12px auto;
            padding: 0 10px;
        }

        .dashboard-card {
            padding: 16px 14px;
            border-width: 2px;
        }

        .dashboard-header {
            margin-bottom: 14px;
        }

        .dashboard-header h1 {
            font-size: 22px;
        }

        .dashboard-header p {
            font-size: 13px;
        }

        .management-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .management-card {
            padding: 10px;
            gap: 6px;
            border-width: 2px;
        }

        .management-card-header {
            gap: 6px;
        }

        .management-card-icon {
            width: 32px;
            height: 32px;
            font-size: 16px;
        }

        .management-card-icon svg {
            width: 16px;
            height: 16px;
        }

        .management-card-title {
            font-size: 13px;
        }

        .management-card-desc {
            font-size: 11px;
            line-height: 1.3;
        }

        .management-card-arrow svg {
            width: 16px;
            height: 16px;
        }
    }

    @media (max-width: 480px) {
        .dashboard-container {
            margin: 8px auto;
            padding: 0 6px;
        }

        .dashboard-card {
            padding: 10px 8px;
            border-width: 2px;
        }

        .dashboard-header {
            margin-bottom: 10px;
        }

        .dashboard-header h1 {
            font-size: 18px;
        }

        .dashboard-header p {
            font-size: 12px;
        }

        .management-grid {
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .management-card {
            padding: 8px 6px;
            gap: 4px;
            border-width: 2px;
        }

        .management-card-header {
            gap: 4px;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .management-card-icon {
            width: 28px;
            height: 28px;
            font-size: 14px;
        }

        .management-card-icon svg {
            width: 14px;
            height: 14px;
        }

        .management-card-title {
            font-size: 11px;
            white-space: normal;
            text-align: center;
            line-height: 1.2;
        }

        .management-card-desc {
            display: none;
        }

        .management-card-arrow {
            display: none;
        }
    }
</style>

<div class="dashboard-container">
    <div class="dashboard-card">
        <div class="sports-decoration"></div>
        
        <div class="dashboard-header">
            <h1>管理后台</h1>
            <p>系统功能管理与配置</p>
        </div>

        <div class="management-grid">
            <a href="{% url 'admin_statistics' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon purple">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">数据统计</h3>
                </div>
                <p class="management-card-desc">查看场地、预约、时段等统计数据</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_court_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon blue">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/>
                            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">场地管理</h3>
                </div>
                <p class="management-card-desc">添加、编辑和删除场地信息</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_availability_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon orange">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">可用时段</h3>
                </div>
                <p class="management-card-desc">设置场地每天的开放时间</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_bookings' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon green">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">预约管理</h3>
                </div>
                <p class="management-card-desc">查看和管理所有预约记录</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            {% if is_super_admin %}
            <a href="{% url 'admin_user_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon orange">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <polyline points="17 11 19 13 23 9"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">用户管理</h3>
                </div>
                <p class="management-card-desc">管理系统用户、编辑用户类型</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
