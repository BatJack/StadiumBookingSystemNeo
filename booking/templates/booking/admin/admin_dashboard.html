{% extends 'booking/base.html' %}

{% block title %}管理后台 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .dashboard-container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .dashboard-card {
        background: white;
        border-radius: 0;
        padding: 48px 40px;
        box-shadow: none;
        border: 3px solid #ecf0f1;
        position: relative;
        overflow: hidden;
    }

    .dashboard-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: #3498db;
    }

    .dashboard-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .dashboard-header h1 {
        font-size: 32px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .dashboard-header p {
        color: #7f8c8d;
        font-size: 15px;
    }

    .management-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }

    .management-card {
        background: #ecf0f1;
        border-radius: 0;
        padding: 24px;
        border: 3px solid #bdc3c7;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 16px;
        cursor: pointer;
        text-decoration: none;
    }

    .management-card:hover {
        border-color: #3498db;
        background: white;
    }

    .management-card-header {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .management-card-icon {
        width: 48px;
        height: 48px;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
    }

    .management-card-icon.blue {
        background: #3498db;
        color: white;
    }

    .management-card-icon.orange {
        background: #f39c12;
        color: white;
    }

    .management-card-icon.green {
        background: #2ecc71;
        color: white;
    }

    .management-card-icon.purple {
        background: #9b59b6;
        color: white;
    }

    .management-card-title {
        font-size: 16px;
        font-weight: 700;
        color: #2c3e50;
        margin: 0;
        letter-spacing: -0.01em;
    }

    .management-card-desc {
        color: #7f8c8d;
        font-size: 14px;
        line-height: 1.6;
        flex-grow: 1;
        font-weight: 400;
    }

    .management-card-arrow {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        color: #7f8c8d;
        transition: all 0.2s ease;
    }

    .management-card:hover .management-card-arrow {
        color: #3498db;
    }

    .sports-decoration {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
    }

    .sports-decoration::before,
    .sports-decoration::after {
        content: '';
        position: absolute;
        opacity: 0.08;
    }

    .sports-decoration::before {
        width: 300px;
        height: 300px;
        background: #3498db;
        top: -150px;
        right: -100px;
    }

    .sports-decoration::after {
        width: 200px;
        height: 200px;
        background: #2ecc71;
        bottom: -100px;
        left: -50px;
    }

    @media (max-width: 768px) {
        .dashboard-container {
            margin: 30px auto;
            padding: 0 16px;
        }

        .dashboard-card {
            padding: 32px 24px;
        }

        .dashboard-header h1 {
            font-size: 28px;
        }

        .management-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }
    }

    @media (max-width: 480px) {
        .dashboard-header h1 {
            font-size: 24px;
        }

        .management-card-icon {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }

        .management-card-title {
            font-size: 15px;
        }
    }
</style>

<div class="dashboard-container">
    <div class="dashboard-card">
        <div class="sports-decoration"></div>
        
        <div class="dashboard-header">
            <h1>管理后台</h1>
            <p>系统功能管理与配置</p>
        </div>

        <div class="management-grid">
            <a href="{% url 'admin_statistics' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon purple">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"/>
                            <line x1="12" y1="20" x2="12" y2="4"/>
                            <line x1="6" y1="20" x2="6" y2="14"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">数据统计</h3>
                </div>
                <p class="management-card-desc">查看场地、预约、时段等统计数据</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_court_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon blue">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/>
                            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">场地管理</h3>
                </div>
                <p class="management-card-desc">添加、编辑和删除场地信息</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_availability_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon orange">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">可用时段</h3>
                </div>
                <p class="management-card-desc">设置场地每天的开放时间</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_bookings' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon green">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">预约管理</h3>
                </div>
                <p class="management-card-desc">查看和管理所有预约记录</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_student_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon purple">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">学员管理</h3>
                </div>
                <p class="management-card-desc">管理学员信息和课时总数</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_course_booking_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon blue">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">课程预约</h3>
                </div>
                <p class="management-card-desc">预约课程、管理课时扣除与退还</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
