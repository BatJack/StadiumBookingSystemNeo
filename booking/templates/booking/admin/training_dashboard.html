{% extends 'booking/base.html' %}

{% block title %}教培管理 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .dashboard-container {
        max-width: 1000px;
        margin: 16px auto;
        padding: 0 16px;
    }

    .dashboard-card {
        background: white;
        border-radius: var(--radius);
        padding: 24px 24px;
        box-shadow: var(--shadow-sm);
        border: 1px solid #e5e7eb;
        position: relative;
        overflow: hidden;
    }

    .dashboard-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #9b59b6;
    }

    .dashboard-header {
        text-align: center;
        margin-bottom: 20px;
    }

    .dashboard-header h1 {
        font-size: 26px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 4px;
        letter-spacing: -0.5px;
    }

    .dashboard-header p {
        color: #7f8c8d;
        font-size: 14px;
        margin: 0;
    }

    .management-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
    }

    .management-card {
        background: #f8fafc;
        border-radius: var(--radius);
        padding: 16px 18px;
        border: 1px solid #cbd5e1;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 10px;
        cursor: pointer;
        text-decoration: none;
    }

    .management-card:hover {
        border-color: #9b59b6;
        background: white;
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
    }

    .management-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .management-card-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }

    .management-card-icon.purple {
        background: #9b59b6;
        color: white;
    }

    .management-card-icon.blue {
        background: #3498db;
        color: white;
    }

    .management-card-title {
        font-size: 16px;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
    }

    .management-card-desc {
        font-size: 13px;
        color: #7f8c8d;
        margin: 0;
        line-height: 1.4;
    }

    .management-card-arrow {
        align-self: flex-end;
        color: #95a5a6;
        transition: all 0.2s ease;
    }

    .management-card:hover .management-card-arrow {
        color: #9b59b6;
        transform: translateX(4px);
    }

    @media (max-width: 768px) {
        .management-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="dashboard-container">
    <div class="dashboard-card">
        <div class="dashboard-header">
            <h1>教培管理</h1>
            <p>管理学员信息和课程预约</p>
        </div>

        <div class="management-grid">
            <a href="{% url 'admin_student_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon purple">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">学员管理</h3>
                </div>
                <p class="management-card-desc">管理学员信息和课时总数</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>

            <a href="{% url 'admin_course_booking_list' %}" class="management-card">
                <div class="management-card-header">
                    <div class="management-card-icon blue">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
                        </svg>
                    </div>
                    <h3 class="management-card-title">课程预约</h3>
                </div>
                <p class="management-card-desc">预约课程、管理课时扣除与退还</p>
                <div class="management-card-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
