{% extends 'booking/base.html' %}

{% block title %}{% if court %}编辑场地{% else %}添加场地{% endif %} - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .page-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }
    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        background-color: #3498db;
        color: white;
        text-decoration: none;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .back-btn:hover {
        background-color: #2980b9;
        transform: translateY(-1px);
    }
    .back-btn:active {
        transform: translateY(0);
    }
    .back-btn:focus-visible {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }
    .page-header-title {
        font-size: 24px;
        font-weight: 700;
        color: #1e293b;
    }
    .form-row {
        display: flex;
        gap: 16px;
    }
    .form-row .form-group {
        flex: 1;
    }
</style>

<div class="page-header">
    <a href="{% url 'admin_court_list' %}" class="back-btn" title="返回场地列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </a>
    <span class="page-header-title">{% if court %}编辑场地{% else %}添加场地{% endif %}</span>
</div>

    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <form method="post">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label for="court_type">场地类型</label>
                    <select id="court_type" name="court_type">
                        <option value="">-- 请选择 --</option>
                        {% for ct in court_types %}
                            <option value="{{ ct.id }}" {% if court and court.court_type_id == ct.id %}selected{% endif %}>{{ ct.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="building">所属场馆</label>
                    <select id="building" name="building">
                        <option value="">-- 请选择 --</option>
                        {% for value, label in building_choices %}
                            <option value="{{ value }}" {% if court and court.building == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="court_number">场地编号</label>
                <select id="court_number" name="court_number">
                    <option value="">-- 请选择 --</option>
                    {% for value, label in court_number_choices %}
                        <option value="{{ value }}" {% if court and court.court_number == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">场地描述</label>
                <textarea id="description" name="description" rows="4" placeholder="请输入场地描述">{% if court %}{{ court.description }}{% endif %}</textarea>
            </div>
            <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 16px;">场地名称将自动生成为：场地类型 + 所属场馆 + 场地编号</p>
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-success">{% if court %}更新{% else %}添加{% endif %}</button>
                <a href="{% url 'admin_court_list' %}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
