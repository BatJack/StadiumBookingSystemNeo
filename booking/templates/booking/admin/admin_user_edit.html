{% extends 'booking/base.html' %}

{% block title %}编辑用户 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .page-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }
    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        background-color: #3498db;
        color: white;
        text-decoration: none;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .back-btn:hover {
        background-color: #2980b9;
        transform: translateY(-1px);
    }
    .back-btn:active {
        transform: translateY(0);
    }
    .back-btn:focus-visible {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }
    .page-header-title {
        font-size: 24px;
        font-weight: 700;
        color: #2c3e50;
        white-space: nowrap;
    }
</style>

<div class="page-header">
    <a href="{% url 'admin_user_list' %}" class="back-btn" title="返回用户列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </a>
    <span class="page-header-title">编辑用户: {{ edit_user.username }}</span>
</div>

    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>用户名</label>
                <input type="text" value="{{ edit_user.username }}" disabled style="background: #f5f5f5; cursor: not-allowed;">
                <small style="color: #7f8c8d;">用户名不可修改</small>
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" value="{{ edit_user.email }}" placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label for="user_type">用户类型</label>
                <select id="user_type" name="user_type" {% if edit_user.id == request.user.id %}disabled{% endif %}>
                    {% for key, label in edit_user.profile.USER_TYPE_CHOICES %}
                        <option value="{{ key }}" {% if edit_user.profile.user_type == key %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                {% if edit_user.id == request.user.id %}
                    <input type="hidden" name="user_type" value="{{ edit_user.profile.user_type }}">
                    <small style="color: #e74c3c;">不能修改自己的用户类型</small>
                {% endif %}
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-success">保存</button>
                <a href="{% url 'admin_user_list' %}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
