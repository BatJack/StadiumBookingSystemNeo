{% extends 'booking/base.html' %}

{% block title %}数据统计 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    .statistics-container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .statistics-card {
        background: var(--bg-secondary);
        border-radius: var(--radius-lg);
        padding: 48px 40px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-color);
        animation: cardEntrance 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
    }

    .statistics-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
    }

    @keyframes cardEntrance {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .statistics-header {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.1s both;
    }

    .statistics-header h1 {
        font-size: 32px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 8px;
        font-family: 'Barlow Condensed', sans-serif;
        letter-spacing: -0.02em;
    }

    .statistics-header p {
        color: var(--text-muted);
        font-size: 15px;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 24px;
        transition: color 0.25s ease;
    }

    .back-link:hover {
        color: var(--primary);
    }

    .stat-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
    }

    .stat-card {
        background: var(--bg-primary);
        border-radius: var(--radius);
        padding: 28px;
        border: 2px solid var(--border-color);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
        animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .stat-card:nth-child(1) { animation-delay: 0.2s; }
    .stat-card:nth-child(2) { animation-delay: 0.25s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.35s; }

    .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card.blue::before { background: var(--info); }
    .stat-card.green::before { background: var(--success); }
    .stat-card.orange::before { background: var(--warning); }
    .stat-card.purple::before { background: #8B5CF6; }

    .stat-card:hover {
        border-color: var(--border-color);
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
    }

    .stat-card:hover::before {
        width: 6px;
    }

    .stat-card-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .stat-card-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-card:hover .stat-card-icon {
        transform: scale(1.05);
    }

    .stat-card-icon.blue {
        background: var(--info-light);
        color: var(--info);
    }

    .stat-card-icon.green {
        background: var(--success-light);
        color: var(--success);
    }

    .stat-card-icon.orange {
        background: var(--warning-light);
        color: var(--warning);
    }

    .stat-card-icon.purple {
        background: #EDE9FE;
        color: #8B5CF6;
    }

    .stat-card-value {
        font-size: 36px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1;
        font-family: 'Fira Sans', sans-serif;
        letter-spacing: -0.02em;
    }

    .stat-card-label {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .sports-decoration {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
    }

    .sports-decoration::before,
    .sports-decoration::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        opacity: 0.05;
        animation: float 6s ease-in-out infinite;
    }

    .sports-decoration::before {
        width: 300px;
        height: 300px;
        background: var(--primary);
        top: -150px;
        right: -100px;
    }

    .sports-decoration::after {
        width: 200px;
        height: 200px;
        background: var(--secondary);
        bottom: -100px;
        left: -50px;
        animation-delay: 3s;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0) scale(1);
        }
        50% {
            transform: translateY(-20px) scale(1.05);
        }
    }

    @media (max-width: 768px) {
        .statistics-container {
            margin: 30px auto;
            padding: 0 16px;
        }

        .statistics-card {
            padding: 32px 24px;
        }

        .statistics-header h1 {
            font-size: 28px;
        }

        .stat-cards {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .stat-card {
            padding: 24px;
        }

        .stat-card-value {
            font-size: 32px;
        }
    }

    @media (max-width: 480px) {
        .statistics-header h1 {
            font-size: 24px;
        }

        .stat-card-value {
            font-size: 28px;
        }

        .stat-card-icon {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }
    }
</style>

<div class="statistics-container">
    <div class="statistics-card">
        <div class="sports-decoration"></div>
        
        <a href="{% url 'admin_dashboard' %}" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            返回管理后台
        </a>

        <div class="statistics-header">
            <h1>数据统计</h1>
            <p>系统运营数据概览</p>
        </div>

        <div class="stat-cards">
            <div class="stat-card blue">
                <div class="stat-card-content">
                    <div class="stat-card-icon blue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/>
                            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                            <line x1="12" y1="12" x2="12" y2="16"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ courts_count|default:"0" }}</div>
                    <div class="stat-card-label">场地总数</div>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-card-content">
                    <div class="stat-card-icon green">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ bookings_count|default:"0" }}</div>
                    <div class="stat-card-label">预约总数</div>
                </div>
            </div>
            <div class="stat-card orange">
                <div class="stat-card-content">
                    <div class="stat-card-icon orange">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ availabilities_count|default:"0" }}</div>
                    <div class="stat-card-label">可用时段</div>
                </div>
            </div>
            <div class="stat-card purple">
                <div class="stat-card-content">
                    <div class="stat-card-icon purple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ students_count|default:"0" }}</div>
                    <div class="stat-card-label">学员总数</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
