{% extends 'booking/base.html' %}

{% block title %}数据统计 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .page-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e7eb;
    }
    .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius);
        background-color: #3498db;
        color: white;
        text-decoration: none;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .back-btn:hover {
        background-color: #2980b9;
        transform: translateY(-1px);
    }
    .back-btn:active {
        transform: translateY(0);
    }
    .back-btn:focus-visible {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }
    .page-header-title {
        font-size: 24px;
        font-weight: 700;
        color: #2c3e50;
        white-space: nowrap;
    }

    .stat-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
    }

    .stat-card {
        background: white;
        border-radius: var(--radius);
        padding: 28px;
        border: 1px solid #e5e7eb;
        box-shadow: var(--shadow-sm);
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    .stat-card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
    }

    .stat-card-content {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .stat-card-icon {
        width: 48px;
        height: 48px;
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        transition: var(--transition);
    }

    .stat-card:hover .stat-card-icon {
        transform: scale(1.05);
    }

    .stat-card-icon.blue {
        background: #3498db;
        color: white;
    }

    .stat-card-icon.green {
        background: #2ecc71;
        color: white;
    }

    .stat-card-icon.orange {
        background: #f39c12;
        color: white;
    }

    .stat-card-icon.purple {
        background: #9b59b6;
        color: white;
    }

    .stat-card-value {
        font-size: 36px;
        font-weight: 700;
        color: #2c3e50;
        line-height: 1;
        font-family: 'Fira Sans', sans-serif;
        letter-spacing: -0.02em;
    }

    .stat-card-label {
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
    }

    @media (max-width: 768px) {
        .page-header {
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header-title {
            font-size: 20px;
        }
        .stat-cards {
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .stat-card {
            padding: 24px;
        }
        .stat-card-value {
            font-size: 32px;
        }
    }

    @media (max-width: 480px) {
        .back-btn {
            width: 36px;
            height: 36px;
        }
        .page-header-title {
            font-size: 18px;
        }
        .stat-card-value {
            font-size: 28px;
        }
        .stat-card-icon {
            width: 40px;
            height: 40px;
            font-size: 18px;
        }
    }
</style>

<div class="page-header">
    <a href="{% url 'admin_dashboard' %}" class="back-btn" title="返回管理后台">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </a>
    <span class="page-header-title">数据统计</span>
</div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; white-space: nowrap;">系统运营数据概览</h2>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon blue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2"/>
                            <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                            <line x1="12" y1="12" x2="12" y2="16"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ courts_count|default:"0" }}</div>
                    <div class="stat-card-label">场地总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon green">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2"/>
                            <line x1="16" y1="2" x2="16" y2="6"/>
                            <line x1="8" y1="2" x2="8" y2="6"/>
                            <line x1="3" y1="10" x2="21" y2="10"/>
                            <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ bookings_count|default:"0" }}</div>
                    <div class="stat-card-label">预约总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon orange">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ availabilities_count|default:"0" }}</div>
                    <div class="stat-card-label">可用时段</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-content">
                    <div class="stat-card-icon purple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="stat-card-value">{{ students_count|default:"0" }}</div>
                    <div class="stat-card-label">学员总数</div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
