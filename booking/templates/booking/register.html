{% extends 'booking/base.html' %}

{% block title %}注册 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    .nav {
        display: none !important;
    }

    .flat-bg {
        position: fixed;
        inset: 0;
        background: #f5f5f5;
        z-index: -1;
        contain: strict;
    }

    .flat-shape {
        position: absolute;
        z-index: 0;
        will-change: transform;
        contain: layout style paint;
    }

    .flat-shape.shape-1 {
        width: 400px;
        height: 400px;
        background: #3498db;
        top: -100px;
        right: -100px;
        border-radius: 50%;
    }

    .flat-shape.shape-2 {
        width: 300px;
        height: 300px;
        background: #2ecc71;
        bottom: -80px;
        left: -80px;
        border-radius: 50%;
    }

    .flat-shape.shape-3 {
        width: 200px;
        height: 200px;
        background: #e74c3c;
        top: 40%;
        left: 10%;
        transform: rotate(45deg);
    }

    .flat-shape.shape-4 {
        width: 150px;
        height: 150px;
        background: #f39c12;
        bottom: 30%;
        right: 15%;
        border-radius: 50%;
    }

    .register-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    .register-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 48px 40px;
        border-radius: var(--radius-lg);
        position: relative;
    }

    .register-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 6px;
        height: 100%;
        background: #2ecc71;
        border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }

    .register-header {
        text-align: left;
        margin-bottom: 36px;
    }

    .register-header h2 {
        font-size: 32px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .register-header p {
        color: #7f8c8d;
        font-size: 15px;
    }

    .register-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .form-group {
        position: relative;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #334155;
        font-size: 14px;
    }

    .input-wrapper {
        position: relative;
    }

    .input-wrapper input {
        width: 100%;
        padding: 16px 16px 16px 50px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        font-size: 15px;
        color: #1e293b;
        border-radius: var(--radius);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .input-wrapper input:focus {
        outline: none;
        background: #ffffff;
        border-color: #2ecc71;
        box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
    }

    .input-wrapper input:focus-visible {
        outline: 2px solid #2ecc71;
        outline-offset: 2px;
    }

    .input-wrapper input::placeholder {
        color: #95a5a6;
    }

    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
    }

    .input-wrapper input:focus + .input-icon {
        color: #2ecc71;
    }

    .btn-register {
        width: 100%;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 700;
        background: #2ecc71;
        color: #ffffff;
        border: none;
        cursor: pointer;
        border-radius: var(--radius);
        letter-spacing: 0.5px;
        transition: background-color 0.2s ease, transform 0.2s ease;
        margin-top: 8px;
    }

    .btn-register:hover {
        background: #27ae60;
        transform: translateY(-1px);
    }

    .btn-register:active {
        background: #1e8449;
        transform: translateY(0);
    }

    .btn-register:focus-visible {
        outline: 2px solid #2ecc71;
        outline-offset: 2px;
    }

    .btn-register:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
    }

    .btn-register .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
        will-change: transform;
    }

    .btn-register.loading .spinner {
        display: inline-block;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .register-footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e7eb;
    }

    .register-footer p {
        color: #64748b;
        font-size: 14px;
    }

    .register-footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .register-footer a:hover {
        color: #2980b9;
    }

    @media (max-width: 480px) {
        .register-card {
            padding: 36px 24px;
        }

        .register-header h2 {
            font-size: 28px;
        }

        .flat-shape.shape-3,
        .flat-shape.shape-4 {
            display: none;
        }

        .flat-shape.shape-1 {
            width: 250px;
            height: 250px;
        }

        .flat-shape.shape-2 {
            width: 180px;
            height: 180px;
        }
    }
</style>

<div class="flat-bg">
    <div class="flat-shape shape-1"></div>
    <div class="flat-shape shape-2"></div>
    <div class="flat-shape shape-3"></div>
    <div class="flat-shape shape-4"></div>
</div>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <h2>创建账户</h2>
            <p>注册新账户以开始使用</p>
        </div>

        <form method="post" class="register-form" id="registerForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="email">邮箱（可选）</label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="请输入邮箱（选填）">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码（至少6位）" required>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span class="spinner"></span>
                <span class="btn-text">注册</span>
            </button>
        </form>

        <div class="register-footer">
            <p>已有账户？ <a href="{% url 'login' %}">立即登录</a></p>
        </div>
    </div>
</div>

<script>
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');

    registerForm.addEventListener('submit', function(e) {
        registerBtn.classList.add('loading');
        registerBtn.disabled = true;
    });
</script>
{% endblock %}
