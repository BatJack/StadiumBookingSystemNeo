{% extends 'booking/base.html' %}

{% block title %}登录 - 体育场馆预约系统{% endblock %}

{% block content %}
<style>
    /* 登录页面隐藏导航栏 */
    .nav {
        display: none !important;
    }

    /* 背景装饰 - 使用 GPU 加速 */
    .flat-bg {
        position: fixed;
        inset: 0;
        background: #f5f5f5;
        z-index: -1;
        contain: strict;
    }

    .flat-shape {
        position: absolute;
        z-index: 0;
        will-change: transform;
        contain: layout style paint;
    }

    .flat-shape.shape-1 {
        width: 400px;
        height: 400px;
        background: #3498db;
        top: -100px;
        right: -100px;
        border-radius: 50%;
    }

    .flat-shape.shape-2 {
        width: 300px;
        height: 300px;
        background: #2ecc71;
        bottom: -80px;
        left: -80px;
        border-radius: 50%;
    }

    .flat-shape.shape-3 {
        width: 200px;
        height: 200px;
        background: #e74c3c;
        top: 40%;
        left: 10%;
        transform: rotate(45deg);
    }

    .flat-shape.shape-4 {
        width: 150px;
        height: 150px;
        background: #f39c12;
        bottom: 30%;
        right: 15%;
        border-radius: 50%;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 1;
    }

    .login-card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        padding: 48px 40px;
        border-radius: var(--radius-lg);
        position: relative;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 6px;
        height: 100%;
        background: #3498db;
        border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }

    .login-header {
        text-align: left;
        margin-bottom: 40px;
    }

    .login-header h2 {
        font-size: 32px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .login-header p {
        color: #7f8c8d;
        font-size: 15px;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .form-group {
        position: relative;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #334155;
        font-size: 14px;
    }

    .input-wrapper {
        position: relative;
    }

    .input-wrapper input {
        width: 100%;
        padding: 16px 16px 16px 50px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        font-size: 15px;
        color: #1e293b;
        border-radius: var(--radius);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .input-wrapper input:focus {
        outline: none;
        background: #ffffff;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .input-wrapper input:focus-visible {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }

    .input-wrapper input::placeholder {
        color: #95a5a6;
    }

    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #7f8c8d;
    }

    .input-wrapper input:focus + .input-icon {
        color: #3498db;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
    }

    .remember-me input[type="checkbox"] {
        width: 20px;
        height: 20px;
        border-radius: var(--radius-sm);
        border: 2px solid #bdc3c7;
        cursor: pointer;
        accent-color: #3498db;
    }

    .remember-me label {
        margin-bottom: 0;
        font-weight: 500;
        color: #7f8c8d;
        font-size: 14px;
        text-transform: none;
        letter-spacing: 0;
        cursor: pointer;
    }

    .btn-login {
        width: 100%;
        padding: 18px 24px;
        font-size: 16px;
        font-weight: 700;
        background: #3498db;
        color: #ffffff;
        border: none;
        cursor: pointer;
        border-radius: var(--radius);
        letter-spacing: 0.5px;
        transition: background-color 0.2s ease, transform 0.2s ease;
        margin-top: 8px;
    }

    .btn-login:hover {
        background: #2980b9;
        transform: translateY(-1px);
    }

    .btn-login:active {
        background: #21618c;
        transform: translateY(0);
    }

    .btn-login:focus-visible {
        outline: 2px solid #3498db;
        outline-offset: 2px;
    }

    .btn-login:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
    }

    .btn-login .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
        will-change: transform;
    }

    .btn-login.loading .spinner {
        display: inline-block;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .login-footer {
        text-align: center;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid #e5e7eb;
    }

    .login-footer p {
        color: #64748b;
        font-size: 14px;
    }

    .login-footer a {
        color: #3498db;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
    }

    .login-footer a:hover {
        color: #2980b9;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 36px 24px;
        }

        .login-header h2 {
            font-size: 28px;
        }

        /* 移动端隐藏装饰元素，减少渲染开销 */
        .flat-shape.shape-3,
        .flat-shape.shape-4 {
            display: none;
        }

        .flat-shape.shape-1 {
            width: 250px;
            height: 250px;
        }

        .flat-shape.shape-2 {
            width: 180px;
            height: 180px;
        }
    }
</style>

<div class="flat-bg">
    <div class="flat-shape shape-1"></div>
    <div class="flat-shape shape-2"></div>
    <div class="flat-shape shape-3"></div>
    <div class="flat-shape shape-4"></div>
</div>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>欢迎回来</h2>
            <p>登录您的账户以继续</p>
        </div>

        <form method="post" class="login-form" id="loginForm">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">用户名</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe" name="remember_me">
                <label for="rememberMe">记住我</label>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="spinner"></span>
                <span class="btn-text">登录</span>
            </button>
        </form>

        <div class="login-footer">
            <p>还没有账户？ <a href="#">联系管理员</a></p>
        </div>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    window.addEventListener('DOMContentLoaded', function() {
        const rememberedUsername = localStorage.getItem('remembered_username');
        const rememberedPassword = localStorage.getItem('remembered_password');
        
        if (rememberedUsername && rememberedPassword) {
            usernameInput.value = rememberedUsername;
            passwordInput.value = rememberedPassword;
            rememberMeCheckbox.checked = true;
        }
    });

    loginForm.addEventListener('submit', function(e) {
        if (rememberMeCheckbox.checked) {
            localStorage.setItem('remembered_username', usernameInput.value);
            localStorage.setItem('remembered_password', passwordInput.value);
        } else {
            localStorage.removeItem('remembered_username');
            localStorage.removeItem('remembered_password');
        }
        
        loginBtn.classList.add('loading');
        loginBtn.disabled = true;
    });
</script>
{% endblock %}
